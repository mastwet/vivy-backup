[package]
name = "vivy-durable"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Experimental D0 probes of the existing Rig execution and persistence seams."

[features]
default = []
d0-probe = []

[dependencies]
rig-harness = { git = "https://github.com/0xPlaygrounds/rig", rev = "fc556f982d501eea9d7167398a19386e4884e776" }
rig-memory = { git = "https://github.com/0xPlaygrounds/rig", rev = "fc556f982d501eea9d7167398a19386e4884e776" }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_reflect = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "fc556f982d501eea9d7167398a19386e4884e776", features = ["test-utils"] }
rig-harness-test-support = { git = "https://github.com/0xPlaygrounds/rig", rev = "fc556f982d501eea9d7167398a19386e4884e776" }
